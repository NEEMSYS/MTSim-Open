<form method="post">
    {% csrf_token %}
    <label>最大并发容器数: <input type="number" name="max_containers" value="{{ config.max_concurrent_containers }}" min="1"></label><br>
    <label>CPU限制(核数): <input type="number" step="0.1" name="cpu_limit" value="{{ config.cpu_limit }}" min="0.1"></label><br>
    <label>内存限制: <input type="text" name="memory_limit" value="{{ config.memory_limit }}" placeholder="如: 512m, 2g"></label><br>
    <label>GPU限制: <input type="number" name="gpu_limit" value="{{ config.gpu_limit }}" min="0"></label><br>
    <button type="submit" class="button">保存配置</button>
</form>
